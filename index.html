<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barcelona Aile Gezisi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#FBF3E7;
    --paper:#FFFFFF;
    --ink:#3A2E28;
    --muted:#8C7B72;
    --line:#EBDFCF;
    --terracotta:#E0654A;
    --terracotta-dark:#C74E36;
    --sand-dark:#F2E3CC;
    --blue:#2E6F95;
    --green:#3F8F5F;
    --orange:#EA9A3E;
    --red:#C0392B;
    --shadow:0 4px 14px rgba(58,46,40,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:17px;
    line-height:1.4;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overscroll-behavior-y: none;
  }

  header{
    background:linear-gradient(135deg, var(--terracotta), var(--terracotta-dark));
    color:#fff;
    padding:14px 16px 0 16px;
    flex:0 0 auto;
    position:relative;
  }
  .version-badge{
    position:absolute;
    top:10px;
    right:12px;
    font-size:.65rem;
    font-weight:800;
    letter-spacing:.5px;
    background:rgba(255,255,255,0.25);
    padding:2px 7px;
    border-radius:6px;
  }
  header h1{
    margin:0 0 2px 0;
    font-size:1.5rem;
    font-weight:800;
    letter-spacing:.2px;
  }
  header p.sub{
    margin:0 0 12px 0;
    font-size:.95rem;
    opacity:.92;
  }

  .day-tabs{
    display:flex;
    gap:8px;
    padding-bottom:10px;
  }
  .day-tab{
    flex:1;
    border:none;
    border-radius:14px 14px 0 0;
    background:rgba(255,255,255,0.22);
    color:#fff;
    padding:12px 6px;
    font-size:.92rem;
    font-weight:700;
    cursor:pointer;
    min-height:50px;
    transition:background .15s ease, color .15s ease;
  }
  .day-tab small{
    display:block;
    font-weight:500;
    font-size:.68rem;
    opacity:.85;
    margin-top:2px;
  }
  .day-tab.active{
    background:var(--bg);
    color:var(--terracotta-dark);
  }
  .day-tab.active small{ color:var(--muted); opacity:1; }

  .toolbar{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    flex:0 0 auto;
  }
  .search-box{
    flex:1 1 220px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:12px 14px 12px 38px;
    border-radius:12px;
    border:1.5px solid var(--line);
    font-size:1rem;
    background:var(--bg);
    color:var(--ink);
    min-height:44px;
  }
  .search-box input:focus{
    outline:none;
    border-color:var(--terracotta);
  }
  .search-box::before{
    content:"🔍";
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    font-size:1rem;
    opacity:.6;
  }
  .filter-chips{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .chip{
    border:1.5px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    padding:10px 14px;
    border-radius:999px;
    font-size:.9rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    min-height:44px;
  }
  .chip.active{
    background:var(--terracotta);
    border-color:var(--terracotta);
    color:#fff;
  }

  .legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    padding:8px 12px;
    background:var(--sand-dark);
    font-size:.8rem;
    color:var(--muted);
    flex:0 0 auto;
  }
  .legend span{display:flex; align-items:center; gap:5px;}
  .dot{width:11px; height:11px; border-radius:50%; display:inline-block; flex:0 0 auto;}

  .day-banner{
    background:var(--sand-dark);
    border-radius:12px;
    padding:10px 14px;
    font-size:.85rem;
    color:#5c4f47;
    margin-bottom:14px;
    line-height:1.45;
  }
  .zone-header{
    font-size:1rem;
    font-weight:800;
    color:var(--terracotta-dark);
    margin:16px 2px 8px 2px;
  }
  .zone-header:first-of-type{ margin-top:0; }
  .zone-sub{
    font-size:.8rem;
    font-weight:500;
    color:var(--muted);
    margin-top:2px;
  }

  main{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  @media (min-width: 880px){
    main{ flex-direction:row; }
    .map-wrap{ flex:1 1 50%; border-bottom:none; }
    .list-wrap{ flex:1 1 50%; border-top:none; border-left:1px solid var(--line); }
  }

  .map-wrap{
    position:relative;
    flex:1 1 50%;
    min-height:280px;
    border-bottom:1px solid var(--line);
  }
  #map{
    width:100%;
    height:100%;
    background:#dfe9ee;
  }

  .list-wrap{
    flex:1 1 50%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--bg);
    padding:10px 10px 30px 10px;
    min-height:0;
  }
  .empty-msg{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    font-size:1rem;
  }

  .card{
    background:var(--paper);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:12px 14px;
    margin-bottom:12px;
    border:2px solid transparent;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .card.active{
    border-color:var(--terracotta);
    transform:scale(1.01);
  }
  .card.done{
    opacity:.55;
  }
  .card-top{
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .badge-num{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:.95rem;
  }
  .card-title-wrap{ flex:1 1 auto; min-width:0; }
  .card-time{
    font-size:.8rem;
    font-weight:700;
    color:var(--terracotta-dark);
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .card-name{
    font-size:1.12rem;
    font-weight:800;
    margin:1px 0 2px 0;
    word-wrap:break-word;
  }
  .card.done .card-name{ text-decoration:line-through; }
  .cat-label{
    display:inline-block;
    font-size:.75rem;
    font-weight:700;
    color:#fff;
    padding:2px 8px;
    border-radius:8px;
    margin-right:6px;
  }
  .card-note{
    font-size:.92rem;
    color:var(--muted);
    margin:6px 0 0 0;
  }
  .badges-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .food-badge{
    font-size:.78rem;
    font-weight:700;
    padding:4px 9px;
    border-radius:8px;
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .food-badge.halal{ background:#E4F3EA; color:var(--green); }
  .food-badge.halal-full{ background:#DCF0E4; color:#2C7148; }
  .food-badge.no-alcohol{ background:#EAF3F8; color:var(--blue); }
  .food-badge.has-alcohol{ background:#FBEAE7; color:var(--red); }
  .food-badge.ask-halal{ background:#FBF0DE; color:#95611A; }

  .pick-ribbon{
    display:inline-block;
    background:linear-gradient(135deg,#F2C94C,#D4A017);
    color:#3A2E10;
    font-size:.78rem;
    font-weight:800;
    padding:4px 10px;
    border-radius:8px;
    margin-bottom:8px;
  }
  .extra-info{
    margin-top:8px;
    background:var(--sand-dark);
    border-radius:10px;
    padding:8px 10px;
  }
  .extra-row{
    font-size:.83rem;
    color:#5c4f47;
    padding:2px 0;
  }

  .card-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .btn{
    border:none;
    border-radius:12px;
    padding:11px 12px;
    font-size:.92rem;
    font-weight:700;
    cursor:pointer;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex:1 1 auto;
  }
  .btn-route{
    background:var(--blue);
    color:#fff;
  }
  .btn-gmaps{
    background:var(--sand-dark);
    color:var(--ink);
    flex:0 0 auto;
    padding:11px 14px;
  }
  .btn-done{
    background:var(--bg);
    color:var(--ink);
    border:1.5px solid var(--line);
    flex:0 0 auto;
    padding:11px 14px;
  }
  .btn-done.checked{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }
  a.btn{ text-decoration:none; }

  /* Leaflet marker custom styles */
  .pin-wrap{ position:relative; width:38px; height:38px; }
  .pin-circle{
    width:32px; height:32px;
    border-radius:50% 50% 50% 0;
    transform: rotate(-45deg);
    position:absolute;
    left:3px; top:2px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    border:2px solid #fff;
  }
  .pin-circle span{
    transform: rotate(45deg);
    color:#fff;
    font-weight:800;
    font-size:.85rem;
  }
  .pin-badge{
    position:absolute;
    width:15px; height:15px;
    border-radius:50%;
    font-size:9px;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid #fff;
    color:#fff;
    font-weight:800;
  }
  .pin-badge.halal{ background:var(--green); top:-3px; right:-1px; }
  .pin-badge.alcohol{ background:var(--red); bottom:2px; right:-4px; }
  .pin-badge.pick{ background:#D4A017; top:-3px; left:-1px; }
  .pin-wrap.done .pin-circle{ filter:grayscale(.6) brightness(1.15); }

  .leaflet-popup-content{ font-size:.95rem; line-height:1.4; min-width:180px; }
  .leaflet-popup-content b{ font-size:1.02rem; }
  .popup-time{ color:var(--terracotta-dark); font-weight:700; font-size:.82rem; }

  footer{
    flex:0 0 auto;
    text-align:center;
    font-size:.75rem;
    color:var(--muted);
    padding:8px;
    background:var(--sand-dark);
  }
</style>
</head>
<body>

<header>
  <span class="version-badge">v4</span>
  <h1>🇪🇸 Barcelona Aile Gezisi</h1>
  <p class="sub">Esnek, bölge bölge gezi rehberi · kesin saat yok, aynı bölgedekileri birlikte gez</p>
  <div class="day-tabs">
    <button class="day-tab active" data-day="1">Bugün<small>6 Eylül · Chill</small></button>
    <button class="day-tab" data-day="2">Yarın<small>7 Eylül · Kapsamlı</small></button>
    <button class="day-tab" data-day="3">Keşfet<small>Vaktiniz Olursa</small></button>
    <button class="day-tab" data-day="4">Tümü<small>Hepsi Bir Arada</small></button>
  </div>
</header>

<div class="toolbar">
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="Durak ara (isim, açıklama)..." autocomplete="off" />
  </div>
  <div class="filter-chips" id="filterChips">
    <button class="chip active" data-filter="all">Tümü</button>
    <button class="chip" data-filter="halal">🍽️ Helal Yemek</button>
    <button class="chip" data-filter="gezi">🏛️ Geziler</button>
    <button class="chip" data-filter="dis">🏖️ Plaj / Dış Mekân</button>
  </div>
</div>

<div class="legend" id="legend"></div>

<main>
  <div class="map-wrap"><div id="map"></div></div>
  <div class="list-wrap" id="listWrap"></div>
</main>

<footer>Harita karoları için internet gerekir · Veriler cihazda gömülüdür</footer>

  function groupRank(stop){
    if(["gezi","muze","pazar","yapi"].indexOf(stop.category) !== -1) return 1;
    if(["yemek","lezzet"].indexOf(stop.category) !== -1) return 2;
    if(["plaj","yuruyus"].indexOf(stop.category) !== -1) return 3;
    if(stop.category === "etkinlik") return 4;
    return 5;
  }

  var CLUSTER_LABELS = {

  };

  var CAT_LABEL = {
    gezi:"Gezi", muze:"Müze", yemek:"Yemek", plaj:"Plaj",

  var CAT_ICON = {

    yuruyus:"🚶", pazar:"🛒", opsiyonel:"✨",
    yapi:"🏰", lezzet:"🍰", etkinlik:"🎉"
  };

  function categoryColor(cat){
    if(cat==="yemek") return "#3F8F5F";
    if(cat==="plaj" || cat==="yuruyus" || cat==="opsiyonel") return "#EA9A3E";
    if(cat==="yapi") return "#6C5CE7";
    if(cat==="lezzet") return "#C2478B";
    if(cat==="etkinlik") return "#D64550";
    return "#2E6F95";
  }

  function appleMapsUrl(s){
    if(s.addressQuery){ return "https://maps.apple.com/?q=" + encodeURIComponent(s.addressQuery); }
    return "https://maps.apple.com/?ll=" + s.lat + "," + s.lng + "&q=" + encodeURIComponent(s.name);
  }
  function googleMapsUrl(s){
    if(s.addressQuery){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.addressQuery); }
    return "https://www.google.com/maps/search/?api=1&query=" + s.lat + "," + s.lng;
  }
  function googleMapsDirUrl(s){
    if(s.addressQuery){ return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(s.addressQuery); }
    return "https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lng;
  }

  function buildHomeIcon(){
    var html =
      '<div style="width:36px;height:36px;position:relative;">' +
        '<div style="width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);position:absolute;left:3px;top:2px;' +
        'background:#2C2C54;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);">' +
          '<span style="transform:rotate(45deg);font-size:15px;">🏠</span>' +
        '</div>' +
      '</div>';
    return L.divIcon({ html: html, className: "", iconSize:[36,36], iconAnchor:[18,32], popupAnchor:[0,-28] });
  }

  function renderHomeMarker(){
    homeLayer.clearLayers();

      '<div style="margin-top:4px;color:#5c4f47;">' + HOME.note + '</div>' +
      '<div style="margin-top:8px;"><a href="' + appleMapsUrl(HOME) + '" target="_blank" rel="noopener">📍 Yol Tarifi Al</a></div></div>'
    );
    marker.addTo(homeLayer);
  }

  function buildIcon(stop, num, isActive){
    var color = categoryColor(stop.category);
    var done = !!state.completed[stop.id];
    var halalBadge = "";
    var alcoholBadge = "";
    var pickBadge = "";
    if(stop.category === "yemek" && stop.halal !== "ask"){
      halalBadge = '<div class="pin-badge halal">H</div>';
    }
    if(stop.category === "yemek" && stop.alcohol){
      alcoholBadge = '<div class="pin-badge alcohol">A</div>';
    }
    if(stop.pick){
      pickBadge = '<div class="pin-badge pick">★</div>';
    }
    var displayNum = done ? "✓" : num;
    var scale = isActive ? "transform:scale(1.15);" : "";
    var html =
      '<div class="pin-wrap' + (done ? " done" : "") + '" style="' + scale + '">' +
        '<div class="pin-circle" style="background:' + color + '"><span>' + displayNum + '</span></div>' +
        halalBadge + alcoholBadge + pickBadge +
      '</div>';
    return L.divIcon({ html: html, className: "", iconSize:[38,38], iconAnchor:[19,34], popupAnchor:[0,-30] });
  }

  function popupHtml(stop){
    var html = '<div><span class="popup-time">' + stop.time + '</span><br><b>' + stop.name + '</b>';
    html += '<div style="margin-top:4px;color:#5c4f47;">' + CAT_ICON[stop.category] + ' ' + CAT_LABEL[stop.category] + '</div>';
    if(stop.pick){ html += '<div style="margin-top:4px;color:#95611A;font-weight:700;">' + stop.pickLabel + '</div>'; }
    if(stop.note){ html += '<div style="margin-top:4px;">' + stop.note + '</div>'; }
    if(stop.category === "yemek"){
      html += '<div style="margin-top:6px;font-size:.85rem;">';
      if(stop.halal === "full") html += "✅ Tam helal";
      else if(stop.halal === "ask") html += "⚠️ Helal sertifikalı değil, sorarak sipariş verin";
      else html += "🍽️ Helal mutfak";
      html += stop.alcohol ? " · 🍷 Mekanda alkol var" : " · 🚫 Alkolsüz";
      html += "</div>";
    }
    if(stop.extra && stop.extra.length){
      html += '<div style="margin-top:6px;font-size:.82rem;color:#5c4f47;">' + stop.extra.join("<br>") + '</div>';
    }
    html += '<div style="margin-top:8px;"><a href="' + appleMapsUrl(stop) + '" target="_blank" rel="noopener">📍 Yol Tarifi Al</a></div>';
    return html;
  }

  // ---------- FILTER / SEARCH ----------
  function matchesFilter(stop){
    if(state.filter === "all") return true;
    if(state.filter === "halal" || state.filter === "yemek") return stop.category === "yemek";
    if(state.filter === "gezi") return ["gezi","muze","pazar","yapi"].indexOf(stop.category) !== -1;
    if(state.filter === "dis") return ["plaj","yuruyus","opsiyonel"].indexOf(stop.category) !== -1;
    if(state.filter === "yapi") return stop.category === "yapi";
    if(state.filter === "lezzet") return stop.category === "lezzet";
    if(state.filter === "etkinlik") return stop.category === "etkinlik";
    return true;
  }
  function matchesSearch(stop){
    if(!state.search) return true;
    var q = state.search.toLocaleLowerCase("tr");
    var hay = (stop.name + " " + (stop.note||"") + " " + (stop.cuisine||"")).toLocaleLowerCase("tr");
    return hay.indexOf(q) !== -1;
  }

  function getVisibleStops(){
    var stops = STOPS.filter(function(s){ return state.day === 4 || s.day === state.day; })
                      .filter(matchesFilter)
                      .filter(matchesSearch);
    if(state.day === 4){
      stops.sort(function(a,b){
        var r = groupRank(a) - groupRank(b);
        return r !== 0 ? r : a.seq - b.seq;
      });
    } else {
      stops.sort(function(a,b){ return a.seq - b.seq; });
    }
    return stops;
  }

  function zoneLabelFor(stop){
    if(state.day === 4){ return CLUSTER_LABELS[groupRank(stop)]; }
    return stop.zone || null;
  }

  // ---------- RENDER ----------
  function render(){
    renderMap();
    renderList();
  }

  function renderMap(){
    markerLayer.clearLayers();
    routeLayer.clearLayers();
    markersById = {};
    numbersById = {};

    renderHomeMarker();

    var visible = getVisibleStops();

    visible.forEach(function(stop, idx){
      var num = idx + 1;
      numbersById[stop.id] = num;
      var marker = L.marker([stop.lat, stop.lng], { icon: buildIcon(stop, num, stop.id === state.activeId) });
      marker.bindPopup(popupHtml(stop));
      marker.on("click", function(){
        setActive(stop.id, false);
      });
      marker.addTo(markerLayer);
      markersById[stop.id] = marker;
    });

    if(visible.length > 1 && state.day !== 4){
      var latlngs = visible.map(function(s){ return [s.lat, s.lng]; });
      L.polyline(latlngs, {
        color: "#C74E36",
        weight: 3,
        opacity: 0.55,
        dashArray: "6 8"
      }).addTo(routeLayer);
    }

    var boundsPoints = visible.map(function(s){ return [s.lat, s.lng]; });
    boundsPoints.push([HOME.lat, HOME.lng]);
    map.flyToBounds(L.latLngBounds(boundsPoints), { padding:[40,40], maxZoom:16, duration:0.6 });
  }

  function renderList(){
    var wrap = document.getElementById("listWrap");
    wrap.innerHTML = "";
    var visible = getVisibleStops();

    if(DAY_INFO[state.day]){
      var banner = document.createElement("div");
      banner.className = "day-banner";
      banner.innerHTML = DAY_INFO[state.day];
      wrap.appendChild(banner);
    }

    if(visible.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-msg";
      empty.textContent = "Bu filtreyle eşleşen durak yok 🙁";
      wrap.appendChild(empty);
      return;
    }

    var lastZone = null;
    visible.forEach(function(stop, idx){
      var num = idx + 1;
      var zLabel = zoneLabelFor(stop);
      if(zLabel && zLabel !== lastZone){
        lastZone = zLabel;
        var sub = ZONE_INFO[zLabel] || CLUSTER_INFO[zLabel] || "";
        var zoneDiv = document.createElement("div");
        zoneDiv.className = "zone-header";
        zoneDiv.innerHTML = "📍 " + zLabel + (sub ? '<div class="zone-sub">' + sub + "</div>" : "");
        wrap.appendChild(zoneDiv);
      }
      var card = document.createElement("div");
      card.className = "card" + (stop.id === state.activeId ? " active" : "") + (state.completed[stop.id] ? " done" : "");
      card.dataset.id = stop.id;

      var badges = "";
      if(stop.category === "yemek"){
        badges += '<div class="badges-row">';
        if(stop.halal === "full"){
          badges += '<span class="food-badge halal-full">✅ Tam Helal</span>';
        } else if(stop.halal === "ask"){
          badges += '<span class="food-badge ask-halal">⚠️ Sertifikalı Değil, Sorarak Sipariş Verin</span>';
        } else {
          badges += '<span class="food-badge halal">🍽️ Helal Mutfak</span>';
        }
        badges += stop.alcohol
          ? '<span class="food-badge has-alcohol">🍷 Mekanda Alkol Var</span>'
          : '<span class="food-badge no-alcohol">🚫 Alkolsüz</span>';
        badges += "</div>";
      }

      var extraHtml = "";
      if(stop.extra && stop.extra.length){
        extraHtml = '<div class="extra-info">' + stop.extra.map(function(line){
          return '<div class="extra-row">' + line + '</div>';
        }).join("") + '</div>';
      }

      var ribbon = stop.pick ? '<div class="pick-ribbon">' + stop.pickLabel + '</div>' : "";

      card.innerHTML =
        ribbon +
        '<div class="card-top">' +
          '<div class="badge-num" style="background:' + categoryColor(stop.category) + '">' + num + '</div>' +
          '<div class="card-title-wrap">' +
            '<div class="card-time">' + stop.time + '</div>' +
            '<div class="card-name">' + stop.name + '</div>' +
            '<span class="cat-label" style="background:' + categoryColor(stop.category) + '">' + CAT_ICON[stop.category] + ' ' + CAT_LABEL[stop.category] + '</span>' +
          '</div>' +
        '</div>' +
        (stop.note ? '<p class="card-note">' + stop.note + '</p>' : "") +
        badges +
        extraHtml +
        '<div class="card-actions">' +
          '<a class="btn btn-route" href="' + appleMapsUrl(stop) + '" target="_blank" rel="noopener">🧭 Yol Tarifi</a>' +
          '<a class="btn btn-gmaps" href="' + googleMapsDirUrl(stop) + '" target="_blank" rel="noopener">G</a>' +
          '<button class="btn btn-done' + (state.completed[stop.id] ? " checked" : "") + '" data-action="toggle-done">' +
            (state.completed[stop.id] ? "✔ Bitti" : "☐ Tamamlandı") +
          '</button>' +
        '</div>';

      card.addEventListener("click", function(e){
        if(e.target.closest("[data-action='toggle-done']") || e.target.closest("a")) return;
        setActive(stop.id, true);
      });

      card.querySelector("[data-action='toggle-done']").addEventListener("click", function(e){
        e.stopPropagation();
        toggleDone(stop.id);
      });

      wrap.appendChild(card);
    });
  }

  function toggleDone(id){
    state.completed[id] = !state.completed[id];
    var marker = markersById[id];
    var stop = STOPS.find(function(s){ return s.id === id; });
    if(marker && stop){
      marker.setIcon(buildIcon(stop, numbersById[id], id === state.activeId));
    }
    renderList();
  }

  function setActive(id, panFromList){
    state.activeId = id;
    var stop = STOPS.find(function(s){ return s.id === id; });
    if(!stop) return;

    // Harita güncelle
    Object.keys(markersById).forEach(function(mid){
      var s = STOPS.find(function(x){ return x.id === mid; });
      markersById[mid].setIcon(buildIcon(s, numbersById[mid], mid === id));
    });
    var marker = markersById[id];
    if(marker){
      marker.openPopup();
      if(panFromList){
        map.flyTo([stop.lat, stop.lng], Math.max(map.getZoom(), 15), { duration:0.6 });
      }
    }

    // Liste güncelle: sadece class değiştir (tam render'a gerek yok)
    var cards = document.querySelectorAll(".card");
    cards.forEach(function(c){
      c.classList.toggle("active", c.dataset.id === id);
    });
    if(!panFromList){
      var activeCard = document.querySelector('.card[data-id="' + id + '"]');
      if(activeCard){
        activeCard.scrollIntoView({ behavior:"smooth", block:"center" });
      }
    }
  }

  // ---------- SEKME BAŞINA FİLTRE / LEGEND ----------
  var CHIP_SETS = {
    1: [
      { key:"all", label:"Tümü" },
      { key:"halal", label:"🍽️ Helal Yemek" },
      { key:"gezi", label:"🏛️ Geziler" },
      { key:"dis", label:"🏖️ Plaj / Dış Mekân" }
    ],
    2: [
      { key:"all", label:"Tümü" },
      { key:"halal", label:"🍽️ Helal Yemek" },
      { key:"gezi", label:"🏛️ Geziler" },
      { key:"dis", label:"🏖️ Plaj / Dış Mekân" }
    ],
    3: [
      { key:"all", label:"Tümü" },
      { key:"yapi", label:"🏰 Yapılar" },
      { key:"lezzet", label:"🍰 Lezzet & Kafe" },
      { key:"yemek", label:"🍽️ Helal Yemek" },
      { key:"etkinlik", label:"🎉 Etkinlikler" }
    ],
    4: [
      { key:"all", label:"Tümü" },
      { key:"halal", label:"🍽️ Helal Yemek" },
      { key:"gezi", label:"🏛️ Geziler & Yapılar" },
      { key:"dis", label:"🏖️ Plaj / Dış Mekân" },
      { key:"lezzet", label:"🍰 Lezzet & Kafe" },
      { key:"etkinlik", label:"🎉 Etkinlikler" }
    ]
  };

  var LEGEND_HTML = {
    1: '<span><i class="dot" style="background:#2E6F95"></i> Gezi / Müze</span>' +
       '<span><i class="dot" style="background:#6C5CE7"></i> Yapı</span>' +
       '<span><i class="dot" style="background:#3F8F5F"></i> Helal Restoran</span>' +
       '<span><i class="dot" style="background:#C2478B"></i> Lezzet / Kafe</span>' +
       '<span>✔️ Tamamlandı</span>',
    2: '<span><i class="dot" style="background:#2E6F95"></i> Gezi / Müze</span>' +
       '<span><i class="dot" style="background:#3F8F5F"></i> Helal Restoran</span>' +
       '<span><i class="dot" style="background:#EA9A3E"></i> Plaj / Dış Mekân</span>' +
       '<span>✔️ Tamamlandı</span>',
    3: '<span><i class="dot" style="background:#6C5CE7"></i> Yapı (Dıştan)</span>' +
       '<span>⭐ İçeri Girilmeye Değer</span>' +
       '<span><i class="dot" style="background:#C2478B"></i> Lezzet / Kafe</span>' +
       '<span><i class="dot" style="background:#3F8F5F"></i> Helal Restoran</span>' +
       '<span><i class="dot" style="background:#D64550"></i> Etkinlik</span>',
    4: '<span><i class="dot" style="background:#2E6F95"></i> Gezi/Müze/Yapı</span>' +
       '<span><i class="dot" style="background:#3F8F5F"></i> Helal Yemek</span>' +
       '<span><i class="dot" style="background:#C2478B"></i> Lezzet/Kafe</span>' +
       '<span><i class="dot" style="background:#EA9A3E"></i> Plaj/Yürüyüş</span>' +
       '<span><i class="dot" style="background:#D64550"></i> Etkinlik</span>' +
       '<span>🏠 Konaklamanız</span>'
  };

  var DAY_INFO = {
    1: "☀️ <b>Bugün Pazar (6 Eylül)</b>, saat 16:21 itibarıyla plan yapıyoruz. Boqueria pazarı bugün kapalı olduğu için programda yok. Aşağıdaki duraklar birbirine yürüme mesafesinde — kesin bir sıra değil, canınız nasıl isterse öyle gezin.",
    2: "📅 <b>Yarın Pazartesi (7 Eylül)</b> — La Pedrera'nın içi ve Picasso Müzesi haftalık kapanış günü olduğu için kapalı; Montjuïc'teki Sihirli Çeşme de sadece Per/Cum/Cmt çalıştığından programda yok (Keşfet sekmesinde not olarak duruyor). İki bölgeye ayrılmış öneriler aşağıda, hepsini yapmak zorunda değilsiniz.",
    3: "💡 Bu sekmedeki yerler zorunlu değil; vaktiniz/enerjiniz kalırsa göz atabileceğiniz ekstra öneriler.",
    4: "🗺️ Günden bağımsız, gezideki <b>tüm duraklar</b> burada bir arada: bugün, yarın ve Keşfet'in her şeyi. 🏠 işareti konaklamanız (Carrer d'Aragó, 347); haritada her şeyi ona göre konumlandırabilirsiniz."
  };

  var ZONE_INFO = {
    "Eski Şehir & Born (Rahat Akşam Turu)": "Hepsi birbirine yürüme mesafesinde, sırayı istediğiniz gibi değiştirebilirsiniz.",
    "Gaudí & Eixample (Sabah → Öğleden Sonra)": "Park Güell biraz uzakta (metro ile); Sagrada Família ile Passeig de Gràcia arası birbirine yakın.",
    "Eski Şehir Tamamlama & Deniz (Akşamüstü → Akşam)": "Boqueria La Rambla üzerinde; plaj ve akşam yemeği deniz kenarında birbirine yakın."
  };

  var CLUSTER_INFO = {
    "🏛️ Gezilecek & Görülecek Yerler": "İtinerary'deki ve Keşfet'teki tüm gezi/yapı durakları tek arada.",
    "🍽️ Yeme-İçme (Helal & Lezzet)": "Planlanan yemekler ile ek helal/lezzet önerilerinin tamamı.",
    "🏖️ Plaj & Yürüyüş": "Plaj ve yürüyüş duraklarının tamamı.",
    "🎉 Etkinlikler": "Festival ve etkinlik bilgilerinin tamamı."
  };

  function renderChips(){
    var chips = CHIP_SETS[state.day] || CHIP_SETS[1];
    var validKeys = chips.map(function(c){ return c.key; });
    if(validKeys.indexOf(state.filter) === -1){ state.filter = "all"; }
    var container = document.getElementById("filterChips");
    container.innerHTML = chips.map(function(c){
      return '<button class="chip' + (c.key === state.filter ? " active" : "") + '" data-filter="' + c.key + '">' + c.label + '</button>';
    }).join("");
  }

  function renderLegend(){
    document.getElementById("legend").innerHTML = LEGEND_HTML[state.day] || LEGEND_HTML[1];
  }

  // ---------- EVENTS ----------
  document.querySelectorAll(".day-tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      document.querySelectorAll(".day-tab").forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      state.day = parseInt(tab.dataset.day, 10);
      state.activeId = null;
      state.search = "";
      document.getElementById("searchInput").value = "";
      renderChips();
      renderLegend();
      render();
    });
  });

  document.getElementById("filterChips").addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(!chip) return;
    document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
    chip.classList.add("active");
    state.filter = chip.dataset.filter;
    render();
  });

  document.getElementById("searchInput").addEventListener("input", function(e){
    state.search = e.target.value;
    render();
  });

  // ---------- İLK YÜKLEME ----------
  renderChips();
  renderLegend();
  render();
})();
</script>
</body>
</html>
